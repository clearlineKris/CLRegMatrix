<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
</head>
<body>
    <header class="site-header">
        <div class="wrap header-inner">
            <a class="brand" href="{{ '/' | relative_url }}">
                <span class="brand-mark">◈</span>
                <span class="brand-name">RegMatrix</span>
            </a>
            <nav class="site-nav">
                <a href="{{ '/' | relative_url }}">Index</a>
                <a href="{{ '/#doctrine' | relative_url }}">Doctrine</a>
                <a href="{{ '/#methodology' | relative_url }}">Methodology</a>
            </nav>
        </div>
    </header>

    <main class="wrap site-main">
        {{ content }}
    </main>

    <footer class="site-footer">
        <div class="wrap">
            <p class="disclaimer">RegMatrix is regulatory intelligence, not legal advice. Verify all citations against current statute and agency rule before acting. Sources are point-in-time.</p>
            <p class="colophon">A Veridion product · canna-knowledge across the penumbra · © 2026</p>
        </div>
    </footer>
</body>
</html>
